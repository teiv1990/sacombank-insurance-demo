<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iBaohiem · Tra cứu và Bồi thường</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Trang Tra cứu và Bồi thường của iBaohiem, app Sacombank Pay mở trong WebView (iframe trong demo) */
:root{
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --p-bg:#f3f4f9; --p-card:#ffffff; --p-ink:#161b2e; --p-muted:#6b7285; --p-line:#e6e9f1;
  --bank1:#0B56A4; --bank2:#1A73C9; --hub:#16243a; --hub-acc:#4338ca; --p-ai:#7a2ec8; --p-ai-soft:#f4ecfc;
  --p-ok:#11805a; --p-ok-soft:#e1f4eb; --p-warn:#9a6100; --p-warn-soft:#fff3d9; --p-bad:#b4372f; --p-bad-soft:#fbe6e4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-ui);line-height:1.5}
button{font-family:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--hub-acc);outline-offset:2px}
.screen{position:relative;height:100%;overflow:hidden;background:var(--p-bg);color:var(--p-ink);display:flex;flex-direction:column;font-size:13.5px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.foot{flex:none;padding:12px 16px 26px;background:var(--p-card);border-top:1px solid var(--p-line);display:grid;gap:8px}
.pol{display:flex;gap:11px;align-items:center}
.pol .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--p-ok-soft);color:var(--p-ok)} .pill.bad{background:var(--p-bad-soft);color:var(--p-bad)} .pill.warn{background:var(--p-warn-soft);color:var(--p-warn)} .pill.ai{background:var(--p-ai-soft);color:var(--p-ai)} .pill.mut{background:#eef0f5;color:var(--p-muted)}
.cap{text-align:center;color:var(--p-muted);font-size:11.5px}
/* Hub iBaohiem */
.hb-head{background:var(--p-card);display:flex;align-items:center;gap:10px;padding:8px 14px 10px;border-bottom:1px solid var(--p-line)}
.hb-head .ic{background:none;border:0;color:var(--p-ink);padding:4px;display:grid}
.hb-logo{width:30px;height:30px;border-radius:9px;background:var(--hub);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:-.02em}
.hb-brand{display:flex;gap:9px;align-items:center;flex:1;min-width:0}
.hb-brand b{display:block;font-size:14.5px;line-height:1.1} .hb-brand small{color:var(--p-muted);font-size:11px}
.hb-ver{display:flex;gap:6px;align-items:center;padding:7px 14px;background:#eef1fb;color:var(--hub-acc);font-size:11.5px;font-weight:600}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--p-card);border-bottom:1px solid var(--p-line)}
.tabs button{border:0;background:none;padding:12px 6px 10px;font-weight:700;font-size:13px;color:var(--p-muted);border-bottom:2.5px solid transparent;display:flex;gap:6px;justify-content:center;align-items:center}
.tabs button.on{color:var(--hub-acc);border-color:var(--hub-acc)}
.tabs .cnt{font:600 10.5px var(--f-mono);background:#eceefb;color:var(--hub-acc);padding:1px 6px;border-radius:6px}
.hb-body{padding:14px;display:grid;gap:12px;align-content:start}
.card{background:var(--p-card);border:1px solid var(--p-line);border-radius:16px;padding:14px;display:grid;gap:10px}
.card.flat{border:0}
.ttl{font-weight:800;font-size:15px;margin:0}
.sub{color:var(--p-muted);font-size:12px;margin:0}
.hsec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--p-muted);margin:4px 2px -2px}
.ct{background:var(--p-card);border:1px solid var(--p-line);border-radius:14px;overflow:hidden}
.ct-row{width:100%;border:0;background:none;text-align:left;display:flex;gap:10px;align-items:center;padding:12px;color:var(--p-ink)}
.ct-row .tx{flex:1;min-width:0} .ct-row b{display:block;font-size:13.5px} .ct-row small{font:500 11px var(--f-mono);color:var(--p-muted)}
.chev{color:var(--p-muted);transition:transform .2s} .open .chev{transform:rotate(90deg)}
.ct-det{border-top:1px solid var(--p-line);padding:12px;display:grid;gap:10px;background:#fafbfd}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
.kv .k{font-size:10.5px;color:var(--p-muted);text-transform:uppercase;letter-spacing:.04em} .kv .v{font-weight:700;font-size:12.5px}
.kv .full{grid-column:1/-1}
table.bt{width:100%;border-collapse:collapse;font-size:12px}
table.bt td{padding:7px 0;border-bottom:1px solid var(--p-line);vertical-align:top} table.bt td:last-child{text-align:right;font-weight:700;padding-left:10px;white-space:nowrap}
.note{font-size:11.5px;padding:9px 11px;border-radius:10px;background:#eef1fb;color:var(--hub-acc);line-height:1.45}
.note.warn{background:var(--p-warn-soft);color:var(--p-warn)} .note.ok{background:var(--p-ok-soft);color:var(--p-ok)} .note.ai{background:var(--p-ai-soft);color:var(--p-ai)}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:13.5px;background:var(--hub);color:#fff;display:flex;gap:8px;justify-content:center;align-items:center;width:100%}
.btn.acc{background:var(--hub-acc)} .btn.ai{background:var(--p-ai)}
.btn.sec{background:#eef0f6;color:var(--hub)} .btn.out{background:#fff;color:var(--hub-acc);border:1.5px solid var(--hub-acc)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:8px 11px;font-size:12px;border-radius:9px;width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;padding:22px 12px;display:grid;gap:8px;justify-items:center}
.empty .big{width:54px;height:54px;border-radius:16px;background:var(--p-ai-soft);color:var(--p-ai);display:grid;place-items:center;font-size:24px}
.claim{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--p-line);border-radius:14px;background:var(--p-card);width:100%;text-align:left;color:var(--p-ink)}
.claim .tx{flex:1;min-width:0} .claim b{font-size:13px;display:block} .claim small{font:500 11px var(--f-mono);color:var(--p-muted)}

/* Khai báo */
textarea{width:100%;border:1.5px solid var(--p-line);border-radius:14px;padding:12px;font:inherit;font-size:13.5px;line-height:1.5;resize:none;background:#fff;color:var(--p-ink);min-height:160px}
textarea:focus{border-color:var(--hub-acc);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--p-line);background:#fff;color:var(--p-ink);border-radius:999px;padding:6px 10px;font-size:11.5px;font-weight:600}
.chip.demo{border-style:dashed;color:var(--hub-acc);border-color:#c9cdf2}
.hints{display:grid;gap:5px;font-size:11.5px;color:var(--p-muted)}
.hints span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--p-ai);margin-right:7px;vertical-align:middle}
.mic{display:flex;gap:8px;align-items:center;border:1.5px dashed #d4c2ee;background:var(--p-ai-soft);color:var(--p-ai);font-weight:700;font-size:12.5px;border-radius:12px;padding:9px 12px;width:100%;justify-content:center}

/* AI */
.aihd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.aihd b{color:var(--p-ai);display:flex;gap:6px;align-items:center;font-size:13.5px}
.aicard{border:1.5px solid #e1cdf7;background:linear-gradient(180deg,#fbf7ff,#fff 60%)}
.anl{display:grid;gap:12px;padding:30px 18px}
.anl .orb{width:64px;height:64px;border-radius:50%;margin:10px auto 6px;background:conic-gradient(from 0deg,var(--p-ai),#c7a4f3,var(--hub-acc),var(--p-ai));animation:spin 1.4s linear infinite;display:grid;place-items:center}
.anl .orb::after{content:"";width:50px;height:50px;border-radius:50%;background:var(--p-bg);display:grid;place-items:center;color:var(--p-ai);font-size:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.anl-step{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--p-muted);opacity:.45;transition:opacity .25s}
.anl-step.on{opacity:1;color:var(--p-ink)}
.anl-step .s{width:22px;height:22px;border-radius:50%;border:2px solid var(--p-line);display:grid;place-items:center;flex:none;font-size:11px}
.anl-step.on .s{border-color:var(--p-ai);color:var(--p-ai)}
.anl-step.dn .s{background:var(--p-ok);border-color:var(--p-ok);color:#fff}
.lst{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.lst li{display:flex;gap:8px;font-size:12px;line-height:1.45}
.lst li i{flex:none;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;margin-top:1px}
.lst li i.ok{background:var(--p-ok-soft);color:var(--p-ok)} .lst li i.no{background:#eef0f5;color:var(--p-muted)} .lst li i.wr{background:var(--p-warn-soft);color:var(--p-warn)} .lst li i.ai{background:var(--p-ai-soft);color:var(--p-ai)} .lst li i.bd{background:var(--p-bad-soft);color:var(--p-bad)}
.gcn{border:1.5px solid var(--hub-acc);border-radius:13px;padding:11px;display:grid;gap:4px;background:#f6f6ff}
.gcn .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.gcn b{font-size:13px} .gcn small{font:500 11px var(--f-mono);color:var(--p-muted)}
.q{display:grid;gap:7px}
.q .opt{border:1.5px solid var(--p-line);background:#fff;border-radius:11px;padding:10px 12px;text-align:left;font-size:12.5px;font-weight:600;color:var(--p-ink)}
.q .opt.on{border-color:var(--p-ai);background:var(--p-ai-soft);color:var(--p-ai)}

/* Hướng dẫn mốc */
.okhd{display:flex;gap:11px;align-items:center}
.okhd .c{width:40px;height:40px;border-radius:50%;background:var(--p-ok-soft);color:var(--p-ok);display:grid;place-items:center;flex:none}
.code{font:600 12px var(--f-mono);color:var(--hub-acc)}
.tl{display:grid;gap:0}
.tl-i{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:12px;top:26px;bottom:2px;width:2px;background:var(--p-line)}
.tl-i .m{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;z-index:1}
.m.dn{background:var(--p-ok);color:#fff} .m.wt{background:#fff;border:2px solid var(--hub-acc);color:var(--hub-acc)} .m.wr{background:var(--p-warn);color:#fff} .m.nx{background:#fff;border:2px solid var(--p-line);color:var(--p-muted)}
.tl-i b{font-size:13px;display:block}
.tl-i p{margin:3px 0 0;font-size:11.8px;color:var(--p-muted);line-height:1.45}
.dl{display:inline-flex;gap:5px;align-items:center;font:600 10.5px var(--f-mono);padding:2px 7px;border-radius:6px;background:#eef0f6;color:var(--p-muted);margin-top:5px}
.dl.hot{background:var(--p-warn-soft);color:var(--p-warn)} .dl.ok{background:var(--p-ok-soft);color:var(--p-ok)}
.linkbtn{border:0;background:none;color:var(--p-ai);font-weight:700;font-size:12px;padding:6px 0 0;display:inline-flex;gap:5px;align-items:center}
.tips{display:grid;gap:6px;margin:0;padding-left:18px;font-size:12px;color:var(--p-ink)}
.pend{display:inline-block;font:600 9.5px var(--f-mono);letter-spacing:.04em;padding:1px 5px;border-radius:4px;background:var(--p-warn-soft);color:var(--p-warn);vertical-align:1px;margin-left:4px;white-space:nowrap}

/* Chứng từ */
.lockbar{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px solid #f1c4bf;background:var(--p-bad-soft);color:var(--p-bad);border-radius:13px;padding:10px 12px}
.lockbar b{display:block;font-size:13px} .lockbar small{display:block;font-size:11px;color:var(--p-ink);opacity:.8}
.lockbar .ph{width:32px;height:32px;border-radius:50%;background:var(--p-bad);color:#fff;display:grid;place-items:center;flex:none}
.sel{width:100%;border:1.5px solid var(--p-line);border-radius:12px;padding:10px 12px;font:inherit;font-size:13.5px;color:var(--p-ink);background:#fff}
.drow{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--p-line)}
.drow:first-of-type{border-top:0}
.drow .t{flex:1;min-width:0;font-size:12px;line-height:1.4}
.mini{border:1.5px dashed #c9cdf2;background:#f7f8ff;color:var(--hub-acc);border-radius:9px;padding:6px 9px;font-weight:700;font-size:11px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.dn-t{color:var(--p-ok);font-weight:700;font-size:11px;white-space:nowrap}
.pick{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--p-line);background:#fff;border-radius:13px;padding:10px 12px;color:var(--p-ink)}
.pick:hover{border-color:var(--hub-acc)}
.pick .tx{flex:1;min-width:0} .pick b{display:block;font-size:13px} .pick small{display:block;font:500 10.5px var(--f-mono);color:var(--p-muted)} .pick em{display:block;font-style:normal;font-size:11.5px;color:var(--p-muted);margin-top:2px;line-height:1.35}
.prog{height:6px;border-radius:4px;background:#e7e9f2;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--hub-acc),var(--p-ai));transition:width .35s}
.doc{background:var(--p-card);border:1px solid var(--p-line);border-radius:14px;padding:12px;display:grid;gap:9px}
.doc.dn{border-color:#bfe4d2}
.doc .h{display:flex;gap:10px;align-items:flex-start}
.doc .h .ix{width:24px;height:24px;border-radius:7px;background:#eef0f6;color:var(--p-muted);display:grid;place-items:center;font:600 11px var(--f-mono);flex:none}
.doc.dn .h .ix{background:var(--p-ok);color:#fff}
.doc .h .tx{flex:1;min-width:0} .doc .h b{font-size:12.8px;display:block;line-height:1.35} .doc .h small{font-size:11.2px;color:var(--p-muted);line-height:1.35;display:block;margin-top:2px}
.shot{display:flex;gap:10px;align-items:stretch}
.thumb{width:54px;flex:none;border-radius:8px;background:repeating-linear-gradient(0deg,#e9ecf3 0 6px,#f6f7fb 6px 11px);border:1px solid var(--p-line);position:relative}
.thumb::after{content:"";position:absolute;left:8px;right:14px;top:8px;height:5px;border-radius:3px;background:#c9cfdd}
.ocr{flex:1;min-width:0;display:grid;gap:3px;font-size:11.5px}
.ocr .r{display:flex;justify-content:space-between;gap:8px} .ocr .r span{color:var(--p-muted)} .ocr .r b{text-align:right;font-size:11.5px}
.reading{display:flex;gap:8px;align-items:center;color:var(--p-ai);font-size:12px;font-weight:600}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid #e1cdf7;border-top-color:var(--p-ai);animation:spin .8s linear infinite}
.camb{border:1.5px dashed #c9cdf2;background:#f7f8ff;color:var(--hub-acc);border-radius:10px;padding:9px;font-weight:700;font-size:12px;display:flex;gap:7px;justify-content:center;align-items:center;width:100%}

/* Phương án */
.amt{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--p-ok);font-variant-numeric:tabular-nums}
.calc td{font-variant-numeric:tabular-nums}
.calc tr.tot td{border-bottom:0;font-size:13px;padding-top:9px} .calc tr.tot td:last-child{color:var(--p-ok)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.45}
.chk input{margin-top:2px;width:16px;height:16px;accent-color:var(--hub-acc)}
.acct{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:#f6f7fb}
.acct .ico{width:34px;height:34px;border-radius:10px;background:linear-gradient(120deg,var(--bank1),var(--bank2));display:grid;place-items:center;color:#fff;flex:none}
.route{display:flex;gap:10px;align-items:center;padding:12px;border-radius:13px}
.route.g{background:var(--p-ok-soft);color:var(--p-ok)} .route.y{background:var(--p-warn-soft);color:var(--p-warn)}
.route .lt{width:14px;height:14px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 20%,transparent)}
.route b{font-size:13.5px;display:block} .route small{font-size:11.5px;opacity:.9}
.paid{display:grid;justify-items:center;text-align:center;gap:6px;padding:12px 0 4px}
.paid .c{width:66px;height:66px;border-radius:50%;background:var(--p-ok);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 10px var(--p-ok-soft)}
.mtl{display:grid;gap:8px;font-size:12px}
.mtl div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.mtl span{font:500 10.5px var(--f-mono);color:var(--p-muted);padding-top:1px}

/* Sheet & toast trong điện thoại */
.sheetBg{position:absolute;inset:0;background:rgba(10,14,30,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--p-card);width:100%;border-radius:22px 22px 0 0;padding:16px 16px 24px;display:grid;gap:12px;max-height:82%;overflow-y:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px)}}
.sheet .grab{width:40px;height:4px;border-radius:3px;background:var(--p-line);margin:0 auto}
.draft{font-size:12px;line-height:1.6;background:#fafbfd;border:1px solid var(--p-line);border-radius:12px;padding:12px;white-space:pre-wrap}
.otpIn{display:flex;gap:8px;justify-content:center}
.otpIn input{width:100%;max-width:220px;text-align:center;font:600 22px var(--f-mono);letter-spacing:.35em;border:1.5px solid var(--p-line);border-radius:12px;padding:10px;color:var(--p-ink);background:#fff}
.ptoast{position:absolute;left:16px;right:16px;bottom:92px;background:#1b2236;color:#fff;font-size:12px;padding:10px 12px;border-radius:12px;z-index:30;pointer-events:none;animation:fade .2s}
.inp{width:100%;border:1.5px solid var(--p-line);border-radius:12px;padding:11px 12px;font:inherit;font-size:13.5px;color:var(--p-ink);background:#fff}
.lab{font-size:11.5px;font-weight:700;color:var(--p-muted)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:#eceef5;border-radius:10px;padding:3px}
.seg2 button{border:0;background:none;padding:8px;border-radius:8px;font-weight:700;font-size:12px;color:var(--p-muted)}
.seg2 button.on{background:#fff;color:var(--hub-acc);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vnd=n=>n.toLocaleString("vi-VN")+"đ";

const I={
 back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',

const CALC={loss:50000000,refund:0,parts:[
 {no:"EI2026-40693306",name:"An toàn giao dịch",vu:20000000,yearCap:100000000,usedN:1,usedAmt:12000000,ded:0}]};
function calcRun(){let need=CALC.loss-CALC.refund;return CALC.parts.map(p=>{const yearLeft=p.yearCap-p.usedAmt;const before=need;const pay=Math.max(0,Math.min(need,p.vu,yearLeft)-p.ded);need-=pay;return Object.assign({},p,{yearLeft,before,pay})})}
const RES=calcRun(); const TOTAL=RES.reduce((a,p)=>a+p.pay,0);

};

 const gaveOtp=/(đọc|cung cấp|đưa|gửi|nói)[^.]{0,25}(otp|mã xác thực|mật khẩu)/.test(x)&&!/không[^.]{0,15}(cung cấp|đọc|đưa|gửi|nói)[^.]{0,25}(otp|mã xác thực|mật khẩu)/.test(x);
 if(gaveOtp)return "s4";
 if(/link|đường dẫn|tin nhắn|ứng dụng|chiếm đoạt|điều khiển|giả danh/.test(x))return "s1";
 if(/vay|mượn|người quen|người thân/.test(x))return "s3";
 if(/thẻ|quẹt|atm|rơi ví|mất ví/.test(x))return "s2";
 return "unk"}

  <div class="card"><p class="ttl" style="font-size:14px">Trước khi xác nhận</p>

   <label class="chk"><input type="checkbox" id="safe" ${st.safe?"checked":""} onchange="st_safe(this.checked)">Tôi đã gỡ ứng dụng lạ và đăng nhập lại app ${BANK} trên thiết bị an toàn.</label>

  ${scamNote()}
 </div></div>`,foot:`<div class="foot"><button class="btn acc" id="otpBtn" ${canPay()?"":"disabled"} onclick="sendOtp()">Xác nhận bằng Smart OTP</button>${homeBar}</div>`}
}
const canPay=()=>st.agree&&st.safe&&st.acct.checked;
const upd=()=>{const b=$("otpBtn");if(b)b.disabled=!canPay()};
window.st_agree=v=>{st.agree=v;upd()};
window.st_safe=v=>{st.safe=v;upd()};
window.st_ac=(k,v)=>{st.acct[k]=v;if(st.acct.checked){st.acct.checked=false;render();const e=$(k==="no"?"acNo":"acBank");if(e){e.focus()}}else upd()};
window.checkAcct=()=>{if(String(st.acct.no).replace(/\D/g,"").length<6)return ptoast("Nhập số tài khoản, ít nhất 6 chữ số");st.acct.checked=true;render()};
window.demoAcct=()=>{st.acct={bank:DEMO_ACCT.bank,no:DEMO_ACCT.no,checked:true};render()};
/* Smart OTP nằm trong app ngân hàng: chuyển sang màn xác thực của Sacombank Pay, nhận kết quả về rồi chi trả */
window.sendOtp=()=>toBank({type:"otp",code:codeFor(),amount:TOTAL,acct:`${st.acct.bank} ${mask(st.acct.no)}`});
function payNow(){setClaim("Đã chi trả");go("paid")}

/* ---- 8b. Chuyển chuyên viên ---- */
function scrCs(){

 const p2=out?(s.hit?`Đối chiếu nội dung bạn kể với điều khoản ${s.hit[0]}. Có thể gọi để hỏi thêm.`:"Hỏi thêm thời điểm, số tiền, kênh lừa đảo để xác định sự kiện."):"Xác minh mốc báo ngân hàng và việc bảo quản thẻ. Có thể gọi cho bạn để hỏi thêm.";
 return {top:sbar("hub",out?"15:53":"09:03"),html:hubHead(out?"Tư vấn bồi thường":"Bồi thường",codeFor())+`<div class="body"><div class="hb-body">

  </div></div>
  <div class="card"><p class="ttl" style="font-size:14px">Bạn không cần nhập lại</p><p class="sub" style="color:var(--p-ink);font-size:12.5px">Chuyên viên đã có toàn bộ khai báo, ${out?"":"chứng từ và "}tóm tắt hồ sơ. Nếu cần, chuyên viên nhập bổ sung thay bạn.</p>
   <div class="note">Hotline bồi thường 1900 xxxx (24/7)</div></div>

 </div></div>`,foot:`<div class="foot"><button class="btn sec" onclick="go('hub',{tab:'bt'})">Về danh sách bồi thường</button>${homeBar}</div>`}
}

 if(st.sheet==="form"){const s=sc();return `<div class="sheetBg" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-label="Giấy yêu cầu bồi thường bảo hiểm"><span class="grab"></span>

/* ===== Render ===== */
const SCR={exclRecv:scrExclRecv,unclear:scrUnclear,sending:scrSending,sendErr:scrSendErr,received:scrReceived,hub:scrHub,declare:scrDeclare,analyzing:scrAnalyzing,aiResult:scrAiResult,guide:scrGuide,docs:scrDocs,review:scrReview,calc:scrCalc,paid:scrPaid,cs:scrCs};
function render(){
 const keep=document.querySelector("#screen .body");const sTop=keep?keep.scrollTop:0;const same=render._last===st.screen;
 const r=SCR[st.screen]();
 $("screen").innerHTML=r.top+r.html+(r.foot||"")+sheetHTML()+(st.toast?`<div class="ptoast">${esc(st.toast)}</div>`:"");
 if(same){const b=document.querySelector("#screen .body");if(b)b.scrollTop=sTop}
 render._last=st.screen;
 report();
}

/* ===== Kết nối với app Sacombank Pay ===== */
/* Trang này chạy trong WebView của app. App mở trang, nhận trạng thái hồ sơ và làm bước Smart OTP. */
function toBank(msg){if(parent!==window)parent.postMessage(Object.assign({src:"ibh"},msg),"*")}
window.closeHub=()=>{clearT();st.sheet=null;toBank({type:"close"})};
function report(){
 toBank({type:"state",stage:stageOf(),scen:st.scen,
  claims:st.claims.map(c=>({code:c.code,status:c.status,past:c.scen==="past",gcn:c.scen==="past"?"EI2026-40693306":(((SC[c.scen].gcns||[])[0])||{}).no||""}))});
}
addEventListener("message",e=>{
 const m=e.data||{};if(m.src!=="sbp")return;
 if(m.type==="open")m.screen?go(m.screen,m.extra||{}):render();
 if(m.type==="otpOk")payNow();
 if(m.type==="scen")pickScen(m.key);
 if(m.type==="jump")jump(m.n);
 if(m.type==="reset"){clearT();st=S0();render()}
});
render();
})();
</script>
